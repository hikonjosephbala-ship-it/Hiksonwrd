<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .form-container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Details</h2>

    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter full name" required>

        <label>Dependent</label>
        <input type="text" placeholder="Parent / Guardian name">

        <label>Picture</label>
        <input type="file" accept="image/*">

        <label>Home Address</label>
        <textarea rows="3" placeholder="Enter home address"></textarea>

        <label>School Address</label>
        <textarea rows="3" placeholder="Enter school address"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
